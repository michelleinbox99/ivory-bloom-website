<body class="solid-header">

<!-- INCLUDE:homepage-header -->

<section class="page-hero">
  <div class="container">
    <span class="eyebrow">Search the Atelier</span>
    <h1>What Are You <em>Dreaming Of?</em></h1>

<section class="bg-white" id="searchPage">

    <div class="search-bar-wrap">
      <label for="searchInput" class="sr-only" style="position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);">Search pieces, collections, and guides</label>

    </div>
    <p class="search-status" id="searchStatus" aria-live="polite"></p>
    <div class="shop-grid" id="searchProducts" aria-live="polite"></div>
    <div class="search-pages" id="searchPages"></div>
  </div>
</section>
